<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퇴근 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Righteous&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2a7a;
    --pink: #ff7ac8;
    --lav: #b69cff;
    --sky: #7cd3ff;
    --best: #12a85a;
    --worst: #e8336d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #c9b8ff 0%, #ffc4e8 48%, #ffe0f1 70%, #e7dcff 100%);
    color: var(--ink);
    font-family: "Jua", -apple-system, "Apple SD Gothic Neo", sans-serif;
    overflow-x: hidden;
  }

  /* ---------- background scene ---------- */
  .bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .floor {
    position: fixed; left: -50%; right: -50%; bottom: 0; height: 42vh; z-index: 0;
    background:
      linear-gradient(#ff9ad5 2px, transparent 2px) 0 0 / 64px 64px,
      linear-gradient(90deg, #ff9ad5 2px, transparent 2px) 0 0 / 64px 64px,
      linear-gradient(180deg, rgba(244,214,255,.2), #d9c6ff);
    transform: perspective(420px) rotateX(58deg);
    transform-origin: bottom;
    opacity: .75;
    animation: grid 2.4s linear infinite;
  }
  @keyframes grid { to { background-position: 0 64px, 0 64px, 0 0; } }
  main {
    position: relative; z-index: 2;
    height: 100vh; min-height: 560px;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px 44px;
  }
  .scene { flex: 1 1 0; min-height: 180px; width: 100%; max-width: 720px; overflow: visible; }
  .app { flex: none; }
  @media (min-width: 700px) and (min-aspect-ratio: 11/10) {
    main { flex-direction: row; justify-content: center; gap: 3vw; }
    .scene { height: 100%; max-width: 640px; }
    .app { margin: 0 !important; }
  }
  .twinkle { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .twinkle:nth-of-type(2n) { animation-delay: .5s; }
  .twinkle:nth-of-type(3n) { animation-delay: 1s; }
  @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  .float { animation: float 4s ease-in-out infinite; }
  .float.b { animation-delay: -2s; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .paw { animation: paw 3s cubic-bezier(.5,0,.3,1) infinite; }
  @keyframes paw {
    0%   { transform: translate(340px, 220px) rotate(8deg); }
    24%  { transform: translate(0, 0) rotate(0); }
    30%  { transform: translate(-8px, 5px) rotate(-2deg); }
    38%  { transform: translate(0, 0) rotate(0); }
    54%  { transform: translate(0, 0) rotate(0); }
    80%, 100% { transform: translate(340px, 220px) rotate(8deg); }
  }
  .flap { transform-box: fill-box; animation: flap 3s ease-in-out infinite; }
  .flap.l { transform-origin: left center; }
  .flap.r { transform-origin: right center; }
  @keyframes flap { 0%,30% { transform: scaleX(1); } 38%,66% { transform: scaleX(.08); } 76%,100% { transform: scaleX(1); } }
  .led { animation: led 3s steps(1) infinite; }
  @keyframes led { 0% { fill: #ff4f8b; } 29% { fill: #3dff9a; } 64% { fill: #ff4f8b; } }
  .scr-idle { animation: idle 3s steps(1) infinite; }
  .scr-ok { animation: ok 3s steps(1) infinite; }
  @keyframes idle { 0% { opacity: 1; } 29% { opacity: 0; } 64% { opacity: 1; } }
  @keyframes ok { 0% { opacity: 0; } 29% { opacity: 1; } 64% { opacity: 0; } }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 3s ease-out infinite; }
  @keyframes pop {
    0%, 27% { opacity: 0; transform: scale(.3); }
    33% { opacity: 1; transform: scale(1.15); }
    38%, 58% { opacity: 1; transform: scale(1); }
    66%, 100% { opacity: 0; transform: scale(1); }
  }
  .burst { transform-box: fill-box; transform-origin: center; animation: burst 3s ease-out infinite; }
  @keyframes burst {
    0%, 28% { opacity: 0; transform: scale(.4); }
    32% { opacity: 1; }
    52%, 100% { opacity: 0; transform: scale(1.4); }
  }
  .sign { animation: sign 1.2s steps(1) infinite; }
  @keyframes sign { 0% { opacity: 1; } 85% { opacity: .55; } }
  .hearts use { transform-box: fill-box; transform-origin: center; animation: heartUp 3s ease-out infinite; opacity: 0; }
  .hearts use:nth-child(2) { animation-delay: .08s; }
  .hearts use:nth-child(3) { animation-delay: .16s; }
  .hearts use:nth-child(4) { animation-delay: .04s; }
  @keyframes heartUp {
    0%, 30% { opacity: 0; transform: translateY(20px) scale(.4); }
    36% { opacity: 1; transform: translateY(0) scale(1.1); }
    62%, 100% { opacity: 0; transform: translateY(-50px) scale(.9) rotate(15deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .scene *, .bg *, .floor { animation: none !important; }
  }

  .ticker {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    background: linear-gradient(90deg, var(--pink), var(--lav), var(--sky));
    color: #fff; font-size: 15px; letter-spacing: 1px;
    white-space: nowrap; overflow: hidden; padding: 7px 0;
    border-top: 2px solid #fff;
    text-shadow: 0 1px 0 rgba(59,42,122,.35);
  }
  .ticker span { display: inline-block; padding-left: 100%; animation: tick 18s linear infinite; }
  @keyframes tick { to { transform: translateX(-100%); } }

  /* ---------- stopwatch window ---------- */
  .app {
    position: relative; z-index: 2;
    width: calc(100% - 32px); max-width: 400px;
    margin: 0 auto 20px;
    background: rgba(255,255,255,.58);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 2px solid #fff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(120,80,200,.25), inset 0 0 0 1px rgba(182,156,255,.5);
  }
  .app::before, .app::after {
    content: ""; position: absolute; z-index: -1; top: -22px;
    width: 38px; height: 34px;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    border-radius: 6px;
  }
  .app::before { left: 22px; background: linear-gradient(160deg, #ffc2e6, var(--pink)); transform: rotate(-12deg); }
  .app::after { right: 22px; background: linear-gradient(200deg, #c9ecff, var(--sky)); transform: rotate(12deg); }
  .titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    border-radius: 18px 18px 0 0;
    background: linear-gradient(90deg, var(--pink), var(--lav), var(--sky));
    color: #fff; font-size: 15px;
    text-shadow: 0 1px 0 rgba(59,42,122,.35);
  }
  .dots { display: flex; gap: 6px; }
  .dots i {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff 0 25%, #ffd1ec 40%, #ff8fcf 100%);
    border: 1px solid rgba(255,255,255,.9);
  }
  .body { padding: 18px 20px 20px; }
  .display {
    font-family: "Righteous", sans-serif;
    font-size: clamp(44px, 14vw, 64px);
    text-align: center;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #7b5cff 0%, #3b2a7a 48%, #ff4fb3 52%, #ff9ad5 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 0 #fff);
    margin: 4px 0 18px;
  }
  .display .ms { font-size: .55em; }
  .controls { display: flex; gap: 14px; justify-content: center; margin-bottom: 16px; }
  button {
    position: relative;
    flex: 1; max-width: 150px; height: 52px;
    border-radius: 999px;
    border: 2px solid #fff;
    font-family: inherit; font-size: 20px; color: #fff;
    text-shadow: 0 1px 0 rgba(0,0,0,.2);
    cursor: pointer; overflow: hidden;
    box-shadow: 0 4px 10px rgba(120,80,200,.25);
    transition: transform .1s, opacity .2s;
  }
  button::before {
    content: ""; position: absolute; left: 10%; right: 10%; top: 3px; height: 45%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0));
    pointer-events: none;
  }
  button:active { transform: scale(.95); }
  button:disabled { opacity: .45; cursor: default; }
  #lapReset { background: linear-gradient(180deg, #d9ccff, #9a86e8); }
  #startStop { background: linear-gradient(180deg, #9dffc8, #26c46e); }
  #startStop.running { background: linear-gradient(180deg, #ffa8cf, #ff3f8e); }
  ul {
    list-style: none; max-height: 170px; overflow-y: auto;
    border-top: 2px dotted rgba(182,156,255,.8);
  }
  li {
    display: flex; justify-content: space-between;
    padding: 9px 4px;
    border-bottom: 2px dotted rgba(182,156,255,.5);
    font-size: 16px;
  }
  li span:last-child { font-family: "Righteous", sans-serif; font-variant-numeric: tabular-nums; }
  li.best { color: var(--best); }
  li.worst { color: var(--worst); }
  .hint { text-align: center; font-size: 13px; opacity: .7; margin-top: 12px; }
</style>
</head>

<script>
  const display = document.getElementById('display');
  const startStopBtn = document.getElementById('startStop');
  const lapResetBtn = document.getElementById('lapReset');
  const lapsEl = document.getElementById('laps');

  let running = false;
  let startTime = 0;   // performance.now() at last start
  let elapsed = 0;     // accumulated ms before last start
  let lapStart = 0;    // total elapsed at start of current lap
  let laps = [];       // lap durations in ms
  let rafId = null;

  const now = () => elapsed + (running ? performance.now() - startTime : 0);

  function format(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    const pad = n => String(n).padStart(2, '0');
    const main = (h ? h + ':' : '') + pad(m) + ':' + pad(s);
    return { main, cs: '.' + pad(cs) };
  }

  function render() {
    const t = format(now());
    display.innerHTML = `${t.main}<span class="ms">${t.cs}</span>`;
    const current = lapsEl.querySelector('li.current span:last-child');
    if (current) {
      const lt = format(now() - lapStart);
      current.textContent = lt.main + lt.cs;
    }
    if (running) rafId = requestAnimationFrame(render);
  }

  function renderLaps() {
    lapsEl.innerHTML = '';
    if (running || elapsed > 0) {
      const lt = format(now() - lapStart);
      lapsEl.insertAdjacentHTML('beforeend',
        `<li class="current"><span>랩 ${laps.length + 1}</span><span>${lt.main + lt.cs}</span></li>`);
    }
    const min = Math.min(...laps), max = Math.max(...laps);
    for (let i = laps.length - 1; i >= 0; i--) {
      let cls = '';
      if (laps.length >= 2) {
        if (laps[i] === min) cls = 'best';
        else if (laps[i] === max) cls = 'worst';
      }
      const t = format(laps[i]);
      lapsEl.insertAdjacentHTML('beforeend',
        `<li class="${cls}"><span>랩 ${i + 1}</span><span>${t.main + t.cs}</span></li>`);
    }
  }

  function updateButtons() {
    startStopBtn.textContent = running ? '정지' : '시작';
    startStopBtn.classList.toggle('running', running);
    lapResetBtn.textContent = running || elapsed === 0 ? '랩' : '재설정';
    lapResetBtn.disabled = !running && elapsed === 0;
  }

  function toggle() {
    if (running) {
      elapsed = now();
      running = false;
      cancelAnimationFrame(rafId);
    } else {
      startTime = performance.now();
      running = true;
      rafId = requestAnimationFrame(render);
    }
    updateButtons();
    renderLaps();
    render();
  }

  function lap() {
    if (!running) return;
    const t = now();
    laps.push(t - lapStart);
    lapStart = t;
    renderLaps();
  }

  function reset() {
    if (running) return;
    elapsed = 0; lapStart = 0; laps = [];
    updateButtons();
    renderLaps();
    render();
  }

  startStopBtn.addEventListener('click', toggle);
  lapResetBtn.addEventListener('click', () => running ? lap() : reset());

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') lap();
    else if (e.key === 'r' || e.key === 'R') reset();
  });
</script>
</body>
</html>
